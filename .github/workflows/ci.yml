name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.backend.outputs.present }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_garden
          POSTGRES_USER: smart_garden
          POSTGRES_PASSWORD: smart_garden_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_garden -d smart_garden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://smart_garden:smart_garden_local_only@localhost:5432/smart_garden
      SECRET_KEY: ci-test-only-not-production
      AUTH_SESSION_TTL_SECONDS: 3600
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Backend
        id: backend
        shell: bash
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.backend.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend dependencies
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ruff
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: ruff check .

      - name: Pytest
        if: steps.backend.outputs.present == 'true' && hashFiles('backend/tests/test_*.py', 'backend/tests/**/*_test.py') != ''
        working-directory: backend
        run: pytest

      - name: Migration round trip on disposable CI database
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Backend not created yet
        if: steps.backend.outputs.present != 'true'
        run: echo "Backend scaffold is not present yet; Backend checks skipped."

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.frontend.outputs.present }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Frontend
        id: frontend
        shell: bash
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        if: steps.frontend.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.frontend.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build
        if: steps.frontend.outputs.present == 'true'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

      - name: Frontend not created yet
        if: steps.frontend.outputs.present != 'true'
        run: echo "Frontend scaffold is not present yet; Frontend checks skipped."

  integration:
    name: Browser auth flow (Frontend → Backend → PostgreSQL)
    needs: [backend, frontend]
    if: needs.backend.outputs.present == 'true' && needs.frontend.outputs.present == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_garden
          POSTGRES_USER: smart_garden
          POSTGRES_PASSWORD: smart_garden_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_garden -d smart_garden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://smart_garden:smart_garden_local_only@localhost:5432/smart_garden
      SECRET_KEY: ci-test-only-not-production
      AUTH_SESSION_TTL_SECONDS: 3600
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and migrate
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend
          cd backend
          alembic upgrade head
      - name: Seed synthetic users without printing passwords
        working-directory: backend
        run: |
          seed_output=$(python -m app.services.seed)
          director_password=$(printf '%s\n' "$seed_output" | sed -n 's/^director-demo: temporary password (displayed once): //p')
          admin_password=$(printf '%s\n' "$seed_output" | sed -n 's/^admin-demo: temporary password (displayed once): //p')
          test -n "$director_password" && test -n "$admin_password"
          echo "::add-mask::$director_password"
          echo "::add-mask::$admin_password"
          echo "CI_DIRECTOR_PASSWORD=$director_password" >> "$GITHUB_ENV"
          echo "CI_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
      - name: Build Frontend and install test browser
        working-directory: frontend
        run: |
          npm run build
          npx playwright install chromium
      - name: Run browser integration
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/smart-garden-backend.log 2>&1 &
          backend_pid=$!
          npm --prefix frontend run start -- -H 127.0.0.1 -p 3000 > /tmp/smart-garden-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8000/api/v1/health > /dev/null && curl --fail --silent http://localhost:3000/login > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/api/v1/health > /dev/null
          curl --fail --silent http://localhost:3000/login > /dev/null
          npm --prefix frontend run test:e2e
