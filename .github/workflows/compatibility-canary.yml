name: Compatibility canary

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      python-stable:
        description: Stable Python candidate (policy default 3.14)
        default: "3.14"
        required: true
      node-lts:
        description: Node LTS candidate (policy default 24)
        default: "24"
        required: true
      node-current:
        description: Node Current candidate (policy default 26)
        default: "26"
        required: true
      postgres-stable:
        description: Latest stable PostgreSQL major (policy default 18)
        default: "18"
        required: true
      python-prerelease:
        description: Optional explicit Python prerelease (manual advisory only)
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHON_STABLE_CANDIDATE: ${{ inputs.python-stable || '3.14' }}
  NODE_LTS_CANDIDATE: ${{ inputs.node-lts || '24' }}
  NODE_CURRENT_CANDIDATE: ${{ inputs.node-current || '26' }}
  POSTGRES_STABLE_CANDIDATE: ${{ inputs.postgres-stable || '18' }}
  COMPATIBILITY_POLICY_REVIEW_BY: "2026-11-08"
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://smart_garden:smart_garden_local_only@localhost:5432/smart_garden
  SECRET_KEY: compatibility-canary-synthetic-only
  AUTH_SESSION_TTL_SECONDS: 3600
  CORS_ORIGINS: http://localhost:3000
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
  COMPATIBILITY_LANE: stable-forward-canary

jobs:
  compatibility-policy:
    name: Maintained stable/LTS/current policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject stale or misclassified candidates
        run: python3 scripts/check-compatibility-policy.py

  backend-latest:
    name: Python stable / PostgreSQL stable
    needs: compatibility-policy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.postgres-stable || '18' }}
        env:
          POSTGRES_DB: smart_garden
          POSTGRES_USER: smart_garden
          POSTGRES_PASSWORD: smart_garden_local_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smart_garden -d smart_garden"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_STABLE_CANDIDATE }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS_CANDIDATE }}
          package-manager-cache: false
      - name: Resolve and print exact candidates
        run: |
          python -c 'import platform, os; actual=platform.python_version(); expected=os.environ["PYTHON_STABLE_CANDIDATE"]+"."; assert actual.startswith(expected), (actual, expected); print("Python", actual)'
          node --version
          docker exec "${{ job.services.postgres.id }}" postgres --version
      - name: Install PostgreSQL 18 client tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          pg_dump --version | grep -F '18.'
          source_version_num="$(psql --no-psqlrc --tuples-only --no-align --host localhost --port 5432 --username smart_garden --dbname smart_garden --command 'SHOW server_version_num')"
          test "$source_version_num" -ge 180000
          test "$source_version_num" -lt 190000
          unset source_version_num
      - name: Install locked backend and validate contracts
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip check
          python -m compileall -q backend/app
          python scripts/backend-contract-smoke.py
          python scripts/check-test-policy.py
      - name: Migrations, locking, security and failure regressions
        working-directory: backend
        run: |
          alembic upgrade head
          pytest tests/test_platform_quality.py tests/test_account_access.py tests/test_auth.py tests/test_product_features.py tests/test_communications_v2.py tests/test_stage6_teacher_cabinet.py tests/test_stage4_announcements.py
          test "$(alembic heads | wc -l)" -eq 1
          alembic downgrade -1
          alembic upgrade head
      - name: Verify disposable PostgreSQL 18 backup and recovery
        working-directory: backend
        env:
          PGPASSWORD: smart_garden_local_only
        run: |
          seed_output=$(python -m app.services.seed)
          test -n "$seed_output"
          unset seed_output
          recovery_database_url="postgresql+psycopg://smart_garden:smart_garden_local_only@localhost:5432/smart_garden_recovery_compat_18"
          PGHOST=localhost \
          PGPORT=5432 \
          PGUSER=smart_garden \
          SOURCE_DATABASE=smart_garden \
          RECOVERY_DATABASE=smart_garden_recovery_compat_18 \
          DATABASE_URL="$DATABASE_URL" \
          RECOVERY_DATABASE_URL="$recovery_database_url" \
          APP_ENV=test \
          RECOVERY_VERIFICATION_SYNTHETIC=YES \
          ../scripts/verify-backup-restore.sh
          recovery_version_num="$(psql --no-psqlrc --tuples-only --no-align --host localhost --port 5432 --username smart_garden --dbname smart_garden_recovery_compat_18 --command 'SHOW server_version_num')"
          test "$recovery_version_num" -ge 180000
          test "$recovery_version_num" -lt 190000
          unset recovery_version_num
          unset recovery_database_url
      - name: Sanitized candidate version report
        run: python scripts/version-report.py | tee compatibility-backend.json
      - uses: actions/upload-artifact@v6
        with:
          name: compatibility-backend-versions
          path: compatibility-backend.json

  frontend-latest:
    name: Node ${{ matrix.lane }} frontend
    needs: compatibility-policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: LTS
            version: ${{ inputs.node-lts || '24' }}
          - lane: Current
            version: ${{ inputs.node-current || '26' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_STABLE_CANDIDATE }}
      - name: Install and validate candidate tree
        working-directory: frontend
        run: |
          node --version
          npm ci
          npm ls --all
          npm run lint
          npx tsc --noEmit
          npm run build
          node scripts/check-npm-audit.mjs
      - name: Sanitized candidate version report
        run: python scripts/version-report.py | tee "compatibility-frontend-${{ matrix.lane }}.json"
      - uses: actions/upload-artifact@v6
        with:
          name: compatibility-frontend-${{ matrix.lane }}-versions
          path: compatibility-frontend-${{ matrix.lane }}.json

  browser-portability:
    name: Real browser portability (${{ matrix.browser }})
    needs: compatibility-policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:${{ inputs.postgres-stable || '18' }}
        env:
          POSTGRES_DB: smart_garden
          POSTGRES_USER: smart_garden
          POSTGRES_PASSWORD: smart_garden_local_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smart_garden -d smart_garden"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_STABLE_CANDIDATE }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS_CANDIDATE }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, migrate and create disposable browser fixtures
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          npm ci --prefix frontend
          cd backend
          alembic upgrade head
          cd ..
          fixture_env="$(mktemp)"
          python scripts/compatibility-browser-fixtures.py "$fixture_env"
          while IFS='=' read -r name value; do
            test -n "$name" && test -n "$value"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done < "$fixture_env"
          rm -f "$fixture_env"
      - name: Build and install selected browser
        working-directory: frontend
        run: |
          npm run build
          npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Run real critical portable journey
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 --no-access-log > /tmp/compatibility-backend.log 2>&1 &
          backend_pid=$!
          npm --prefix frontend run start -- -H 127.0.0.1 -p 3000 > /tmp/compatibility-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8000/api/v1/health >/dev/null && curl --fail --silent http://localhost:3000/login >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/api/v1/health >/dev/null
          curl --fail --silent http://localhost:3000/login >/dev/null
          npm --prefix frontend exec -- playwright test tests/platform-compatibility.spec.ts

  prerelease-advisory:
    name: Explicit Python prerelease advisory
    needs: compatibility-policy
    if: github.event_name == 'workflow_dispatch' && inputs.python-prerelease != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-prerelease }}
          allow-prereleases: true
      - name: Advisory import and deprecation sentry
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip check
          python -W error::DeprecationWarning -m compileall -q backend/app
          python -W error::DeprecationWarning scripts/backend-contract-smoke.py

  clean-room-images:
    name: Advisory clean-room images
    needs: compatibility-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned images without cache against refreshed bases
        run: |
          printf 'SMART_GARDEN_PREVIEW_SECRET_KEY=%s\n' "$(openssl rand -hex 48)" > .env.preview
          docker compose --env-file .env.preview -f docker-compose.yml -f docker-compose.preview.yml build --pull --no-cache
