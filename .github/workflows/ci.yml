name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_garden
          POSTGRES_USER: smart_garden
          POSTGRES_PASSWORD: smart_garden_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_garden -d smart_garden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://smart_garden:smart_garden_local_only@localhost:5432/smart_garden
      SECRET_KEY: ci-test-only-not-production
      AUTH_SESSION_TTL_SECONDS: 3600
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Backend
        id: backend
        shell: bash
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.backend.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend dependencies
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ruff
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: ruff check .

      - name: Pytest
        if: steps.backend.outputs.present == 'true' && hashFiles('backend/tests/test_*.py', 'backend/tests/**/*_test.py') != ''
        working-directory: backend
        run: pytest

      - name: Backend not created yet
        if: steps.backend.outputs.present != 'true'
        run: echo "Backend scaffold is not present yet; Backend checks skipped."

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Frontend
        id: frontend
        shell: bash
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        if: steps.frontend.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.frontend.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build
        if: steps.frontend.outputs.present == 'true'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

      - name: Frontend not created yet
        if: steps.frontend.outputs.present != 'true'
        run: echo "Frontend scaffold is not present yet; Frontend checks skipped."
